name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate repository contract
        run: python scripts/validate_repository.py --root .

      - name: Test repository validator
        run: python -m unittest discover --start-directory scripts/tests --verbose

      - name: Validate localization
        run: python scripts/validate_localization.py --root . --strict

      - name: Restore
        run: dotnet restore Tairitsua.Monica.GachaPool.slnx

      - name: Build
        run: dotnet build Tairitsua.Monica.GachaPool.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/Test.Tairitsua.Monica.GachaPool/Test.Tairitsua.Monica.GachaPool.csproj --configuration Release --no-build --no-restore

      - name: Pack
        run: dotnet pack src/Tairitsua.Monica.GachaPool/Tairitsua.Monica.GachaPool.csproj --configuration Release --no-build --no-restore --output artifacts

      - name: Inspect package artifacts
        run: python scripts/inspect_package.py --root . --artifacts artifacts

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
